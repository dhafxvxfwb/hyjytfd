<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Security Access Console</title>
    <style>
        /* Modern Reset & Corporate Geometric Styling Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            /* Attractive corporate teal-to-indigo gradient background (Default Fallback) */
            background: linear-gradient(135deg, #134e5e 0%, #2b5876 50%, #4e54c8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Full Screen Background Web Frame Component */
        .background-iframe-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 0;
            opacity: 0; /* Starts hidden until verified successful load */
            transition: opacity 0.5s ease-in-out;
        }

        /* Translucent network screen overlay controls background alpha visibility */
        .background-alpha-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(19, 78, 94, 0.6); /* Enforces 60% opacity look over target sites */
            z-index: 1;
            display: none; /* Appears only if the iframe loads successfully */
        }

        /* Subtle abstract network lines background overlay */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255,255,255,0.15) 1px, transparent 0);
            background-size: 24px 24px;
            z-index: 2;
            pointer-events: none;
        }

        /* Centered Interstitial Glass Card Frame */
        .gateway-container {
            position: relative;
            z-index: 10; /* Locked high above background asset layers */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            max-width: 440px;
            width: calc(100% - 40px);
            text-align: center;
            overflow: hidden;
        }

        .status-header {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .status-message {
            font-size: 0.95rem;
            color: #e2e8f0;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* White glass-morphic button */
        .action-btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background-color: #ffffff;
            color: #134e5e;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease-in-out;
            box-sizing: border-box;
        }

        .action-btn:hover {
            background-color: #f7fafc;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .loading-widget {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            margin-top: 15px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <iframe id="backgroundWebEngine" class="background-iframe-layer" src="about:blank"></iframe>
    <div id="alphaShield" class="background-alpha-shield"></div>

    <!-- Unified Display Container Console Frame -->
    <div class="gateway-container">
        <div id="topHeader" style="background-color:#21618c; color:white; padding-top:6px; padding-bottom:6px; padding-left:20px; margin:-40px -40px 25px -40px; text-align:left; font-size:0.95rem; font-weight:500; letter-spacing:0.5px;">
            SECURE ACCESS GATEWAY
        </div>

        <div class="status-header" id="statusHeader">Analyzing Gateway</div>
        <div class="status-message" id="statusMessage">Awaiting secure session authorization credentials...</div>
        
        <a href="#" id="navigationGateButton" class="action-btn" style="display: none;">Access Workspace Portal</a>
        <div class="loading-widget" id="loadingWidget">Initializing secure handshake...</div>
    </div>
